name: demoscale

services:
  queue:
    # Redis ist die gemeinsame Queue. Der feste Tag macht die Übung zeitlich
    # nachvollziehbar; der Host veröffentlicht den Redis-Port absichtlich nicht.
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - queue-data:/data
    networks: [scale-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    image: ${REGISTRY_USER:-danbu}/${IMAGE_REPOSITORY:-demoscale}:demoscale-producer-${IMAGE_TAG:-1.0.0}
    pull_policy: always
    environment:
      ORCHESTRATOR: compose
      NODE_NAME: ${COMPOSE_NODE_NAME:-local-engine}
      REDIS_HOST: queue
      QUEUE_KEY: jobs
      JOB_COUNT_DEFAULT: ${JOB_COUNT:-12}
    expose: ["8000"]
    networks: [scale-net]
    depends_on:
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    image: ${REGISTRY_USER:-danbu}/${IMAGE_REPOSITORY:-demoscale}:demoscale-dashboard-${IMAGE_TAG:-1.0.0}
    pull_policy: always
    environment:
      ORCHESTRATOR: compose
      NODE_NAME: ${COMPOSE_NODE_NAME:-local-engine}
      REDIS_HOST: queue
      QUEUE_KEY: jobs
      PRODUCER_URL: http://producer:8000
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    networks: [scale-net]
    depends_on:
      producer:
        condition: service_healthy
      queue:
        condition: service_healthy

  worker:
    image: ${REGISTRY_USER:-danbu}/${IMAGE_REPOSITORY:-demoscale}:demoscale-worker-${IMAGE_TAG:-1.0.0}
    pull_policy: always
    environment:
      ORCHESTRATOR: compose
      NODE_NAME: ${COMPOSE_NODE_NAME:-local-engine}
      REDIS_HOST: queue
      QUEUE_KEY: jobs
      PROCESS_SECONDS: ${PROCESS_SECONDS:-2}
    networks: [scale-net]
    depends_on:
      queue:
        condition: service_healthy

volumes:
  queue-data:

networks:
  scale-net:
