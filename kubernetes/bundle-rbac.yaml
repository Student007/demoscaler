apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: demoscale
    app.kubernetes.io/component: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-bundle-jobs
  labels:
    app.kubernetes.io/name: demoscale
    app.kubernetes.io/component: dashboard
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-bundle-jobs
  labels:
    app.kubernetes.io/name: demoscale
    app.kubernetes.io/component: dashboard
subjects:
  - kind: ServiceAccount
    name: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-bundle-jobs
