# Optionaler Mehrhost-Ausblick. Diese Datei wird mit bereits veröffentlichten
# Images eingesetzt; Docker Swarm baut beim stack deploy keine Images.
services:
  queue:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - queue-data:/data
    networks: [scale-net]
    deploy:
      # Das Volume ist lokal. Die Queue bleibt deshalb bewusst auf einem
      # Knoten, bis Shared Storage eingerichtet wurde.
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  producer:
    image: ${REGISTRY_USER:-danbu}/${IMAGE_REPOSITORY:-demoscale}:demoscale-producer-${IMAGE_TAG:-1.2.8}
    environment:
      ORCHESTRATOR: swarm
      NODE_NAME: "{{.Node.Hostname}}"
      NODE_ID: "{{.Node.ID}}"
      TASK_NAME: "{{.Task.Name}}"
      TASK_SLOT: "{{.Task.Slot}}"
      REDIS_HOST: queue
      QUEUE_KEY: jobs
      JOB_COUNT_DEFAULT: ${JOB_COUNT:-12}
    networks: [scale-net]
    deploy:
      restart_policy:
        condition: on-failure

  dashboard:
    image: ${REGISTRY_USER:-danbu}/${IMAGE_REPOSITORY:-demoscale}:demoscale-dashboard-${IMAGE_TAG:-1.2.8}
    environment:
      ORCHESTRATOR: swarm
      NODE_NAME: "{{.Node.Hostname}}"
      NODE_ID: "{{.Node.ID}}"
      TASK_NAME: "{{.Task.Name}}"
      TASK_SLOT: "{{.Task.Slot}}"
      REDIS_HOST: queue
      QUEUE_KEY: jobs
      PRODUCER_URL: http://producer:8000
    ports:
      - target: 8080
        published: ${DASHBOARD_PORT:-8080}
        protocol: tcp
        mode: ingress
    networks: [scale-net]
    deploy:
      restart_policy:
        condition: on-failure

  worker:
    image: ${REGISTRY_USER:-danbu}/${IMAGE_REPOSITORY:-demoscale}:demoscale-worker-${IMAGE_TAG:-1.2.8}
    environment:
      ORCHESTRATOR: swarm
      NODE_NAME: "{{.Node.Hostname}}"
      NODE_ID: "{{.Node.ID}}"
      TASK_NAME: "{{.Task.Name}}"
      TASK_SLOT: "{{.Task.Slot}}"
      WORKER_NAME: "{{.Task.Name}}"
      REDIS_HOST: queue
      QUEUE_KEY: jobs
      PROCESS_SECONDS: ${PROCESS_SECONDS:-2}
    networks: [scale-net]
    deploy:
      mode: replicated
      replicas: 4
      restart_policy:
        condition: on-failure

volumes:
  queue-data:

networks:
  scale-net:
    driver: overlay
    attachable: true
